<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Актуальний розклад подій EuroAion з автоматичним оновленням.">
  <title>EuroAion розклад</title>
  <link rel="stylesheet" href="css/style.css?v=official-schedule">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BDBL7DSC46"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BDBL7DSC46');
  </script>
</head>
<body>
  <button class="back-button" type="button" aria-label="Повернутися назад">
    <span class="back-icon" aria-hidden="true">←</span>
  </button>

  <main class="page-shell">
    <h1>Розклад EuroAion</h1>
    <div id="current-time" aria-live="polite"></div>

    <div class="schedule-meta">
      <span id="schedule-status" role="status">Завантаження актуального розкладу…</span>
      <a href="https://euroaion.com/ru-RU/Tools/Schedule" target="_blank" rel="noopener noreferrer">Офіційне джерело</a>
    </div>

    <div class="table-shell" tabindex="0" aria-label="Таблицю можна прокручувати горизонтально">
      <table class="schedule-table">
        <caption>Щотижневий розклад подій EuroAion</caption>
        <thead>
          <tr>
            <th scope="col">Інстанс</th>
            <th scope="col">Пн</th>
            <th scope="col">Вт</th>
            <th scope="col">Ср</th>
            <th scope="col">Чт</th>
            <th scope="col">Пт</th>
            <th scope="col">Сб</th>
            <th scope="col">Нд</th>
          </tr>
        </thead>
        <tbody id="schedule-body"></tbody>
      </table>
    </div>

    <p class="schedule-note">Час подій автоматично перерахований для вашого часового поясу.</p>
  </main>

  <script src="js/script.js?v=official-schedule"></script>
</body>
</html>
