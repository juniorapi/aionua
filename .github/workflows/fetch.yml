name: Fetch Aion Live Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests cloudscraper

      - run: python fetch_online.py

      - name: Push online data and schedules
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json euroaion/schedule.json originaion/schedule.json
          git diff --staged --quiet || git commit -m "update live data"
          git push
