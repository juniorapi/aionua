<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор стигм 4.8 — Aion UA</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://juniorapi.github.io/aionua/stigmas/">
  <script>
    // Калькулятор стигм 4.8 — оригінальні сторінки основного сайту, по одній на клас.
    // Посилання v2 мали вигляд #клас/код, а код — той самий, що в оригінальному калькуляторі.
    (function () {
      var classes = ["templar", "gladiator", "ranger", "assassin", "sorcerer", "spiritmaster", "chanter", "cleric", "gunner", "aethertech", "songweaver"];
      var parts = decodeURIComponent(location.hash.slice(1)).split("/");
      var target = "../../stigmas/";
      if (classes.indexOf(parts[0]) !== -1) target += parts[0] + "/" + (parts[1] ? "#" + parts[1] : "");
      location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=../../stigmas/">
</head>
<body>
  <p>Калькулятор стигм 4.8: <a href="../../stigmas/">відкрити</a>.</p>
</body>
</html>
